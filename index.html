<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Multi-Video Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-group label {
      width: 70px;
      font-weight: bold;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
    }
    .video-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }
    iframe {
      width: 100%;
      max-width: 360px;
      height: 215px;
      border: none;
      border-radius: 8px;
    }
    .controls {
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      background-color: #ff0000;
      color: white;
      cursor: pointer;
      margin: 0 5px;
    }
    button.secondary {
      background-color: #333;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>Multi-Video Synchronous Player</h1>

  <div class="input-section">
    <div class="input-group">
      <label for="url1">Video 1:</label>
      <input type="text" id="url1" placeholder="Paste YouTube link or ID..." value="dQw4w9WgXcQ">
    </div>
    <div class="input-group">
      <label for="url2">Video 2:</label>
      <input type="text" id="url2" placeholder="Paste YouTube link or ID..." value="3JZ_D3ELwOQ">
    </div>
    <div class="input-group">
      <label for="url3">Video 3:</label>
      <input type="text" id="url3" placeholder="Paste YouTube link or ID..." value="L_LUpnjgPso">
    </div>
    <button onclick="updateVideos()" style="margin-top: 10px;">Load Videos</button>
  </div>

  <div class="video-container">
    <div id="player1"></div>
    <div id="player2"></div>
    <div id="player3"></div>
  </div>

  <div class="controls">
    <button class="secondary" onclick="playAll()">Play All</button>
    <button class="secondary" onclick="pauseAll()">Pause All</button>
  </div>

  <script>
    const players = [null, null, null];

    // Helper: extracts 11-char video ID from short link, watch URL, embed URL, or raw ID
    function extractVideoId(input) {
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = input.trim().match(regex);
      return match ? match[1] : input.trim();
    }

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      ['url1', 'url2', 'url3'].forEach((id, index) => {
        const videoId = extractVideoId(document.getElementById(id).value);
        players[index] = new YT.Player(`player${index + 1}`, {
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'mute': 1, // Autoplay requires mute in browsers
            'controls': 1
          }
        });
      });
    }

    function updateVideos() {
      ['url1', 'url2', 'url3'].forEach((id, index) => {
        const rawValue = document.getElementById(id).value;
        const videoId = extractVideoId(rawValue);
        if (players[index] && videoId) {
          players[index].loadVideoById(videoId);
        }
      });
    }

    function playAll() {
      players.forEach(p => p && p.playVideo && p.playVideo());
    }

    function pauseAll() {
      players.forEach(p => p && p.pauseVideo && p.pauseVideo());
    }
  </script>
</body>
</html>
